<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Front Seat</title>
  <meta name="description" content="Spin the wheel to decide who gets the front seat.">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Front Seat">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1 id="title">Front Seat</h1>
      <div class="legend" aria-hidden="true">
        <span><i class="swatch swatch-heidi"></i>Heidi</span>
        <span><i class="swatch swatch-hanne"></i>Hanne</span>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="wheel" role="img" aria-label="Roulette wheel with light blue pockets for Heidi and light pink pockets for Hanne"></canvas>
    </div>

    <footer>
      <button type="button" class="btn" id="spin">Spin</button>
    </footer>
  </main>

  <div class="result" id="result" hidden>
    <div class="result-card" id="result-card" role="dialog" aria-modal="true" aria-labelledby="result-name">
      <p class="result-kicker">Front seat goes to</p>
      <p class="result-name" id="result-name"></p>
      <button type="button" class="btn btn-dark" id="again">Spin again</button>
    </div>
  </div>

  <div class="sr-only" id="announce" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
